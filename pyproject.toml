[project]
name = "python-scripts-v2"
version = "1.0.0"
description = "A curated catalog of standalone Python 3 command-line applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["ALL"]
allowed-confusables = ["×", "–", "—", "°", "…"]
ignore = [
  "COM812", # Conflicts with Ruff formatter.
  "D203",   # Conflicts with D211; use no blank line before class docstring.
  "D213",   # Conflicts with D212; summary starts on first docstring line.
  "S311",   # Pseudorandomness is intentional in games and creative tools.
  "T201",   # Console output is the product interface for these CLI apps.
]

[tool.ruff.lint.per-file-ignores]
"apps/**/*.py" = ["PLR2004"] # Small apps use visible domain constants intentionally.
"tests/*.py" = ["S101", "S603"] # Tests assert and execute repository-owned scripts.
"tools/build_catalog.py" = ["E501"] # Markdown templates are checked after generation.
"tools/catalog_specs.py" = ["E501"] # Embedded source is linted after generation.
"tools/*.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
exclude = ['^\.venv/']

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
